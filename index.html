        const data = impulse.getChannelData(c);

      leftG.gain.value = 0.22;

      left.connect(leftG).connect(merger, 0, 0);
      right.connect(rightG).connect(merger, 0, 1);

      const pulse = audioCtx.createOscillator();
      const pulseG = audioCtx.createGain();
      pulse.frequency.value = 0.35;

      pulse.start();

      document.getElementById("slap-num").textContent = slapTarget;
    }

    document.body.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
    window.startSession = startSession;
    window.reply = reply;
    window.cycleVoice = cycleVoice;
    window.toggleBeats = toggleBeats;
    window.connectToy = connectToy;
    window.testVibe = testVibe;
    window.enableMic = enableMic;
    window.stopAll = stopAll;
    window.pauseSession = pauseSession;
    window.resumeSession = resumeSession;
    window.changeSlaps = changeSlaps;
    window.toggleSetup = toggleSetup;
  </script>
</body>
</html>
