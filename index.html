<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <title>Deepthroat Trainer</title>
  <style>
    :root {
      --bg: #0b0b0c;
      --bg-elev: #141416;
      --bg-soft: #1b1b1e;
      --line: rgba(255,255,255,0.08);
      --text: #f4f1ee;
      --muted: #9a938c;
      --accent: #c45c5c;
      --accent-2: #e8b4b4;
      --ok: #7dbe8a;
      --warn: #d4a054;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Söhne", "SF Pro Display", ui-sans-serif, system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    body {
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(196,92,92,0.12), transparent 55%),
        var(--bg);
    }
    #app {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding-top: var(--safe-t);
    }

    header {
      padding: 14px 18px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .brand small {
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 10px;
      color: var(--muted);
    }
    .brand strong {
      font-size: 17px;
      font-weight: 560;
      letter-spacing: -0.02em;
    }
    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .chip {
      font-size: 11px;
      color: var(--muted);
      background: var(--bg-elev);
      border: 1px solid var(--line);
      padding: 6px 9px;
      border-radius: 999px;
    }
    .chip.on { color: var(--ok); border-color: rgba(125,190,138,0.35); }
    .chip.warn { color: var(--warn); }

    #stage {
      position: relative;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 8px 18px 0;
    }
    #info {
      min-height: 42px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
      max-width: 320px;
    }
    #hold-timer {
      display: none;
      margin: 8px 0 4px;
      font-size: 42px;
      font-weight: 520;
      letter-spacing: -0.04em;
      color: var(--accent-2);
    }
    #log {
      position: absolute;
      top: 0;
      left: 16px;
      right: 16px;
      max-height: 54px;
      overflow: hidden;
      font-size: 10px;
      color: rgba(255,255,255,0.28);
      pointer-events: none;
    }

    .target-wrap {
      margin-top: 18px;
      display: grid;
      place-items: center;
      z-index: 8;
    }
    #nose-btn {
      width: min(168px, 42vw);
      height: min(168px, 42vw);
      border-radius: 50%;
      border: 1px solid rgba(232,180,180,0.28);
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.08), transparent 42%),
        radial-gradient(circle at 50% 50%, #2a1818 0%, #140e0e 70%);
      color: var(--accent-2);
      display: grid;
      place-items: center;
      text-align: center;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 11px;
      box-shadow: 0 0 0 10px rgba(196,92,92,0.05), 0 20px 50px rgba(0,0,0,0.35);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    #nose-btn span { display: block; font-size: 10px; opacity: .65; letter-spacing: .28em; margin-top: 6px; }
    #nose-btn.active {
      transform: scale(0.96);
      box-shadow: 0 0 0 14px rgba(196,92,92,0.14), 0 10px 30px rgba(196,92,92,0.2);
    }

    #reply-buttons {
      display: none;
      width: min(360px, 92vw);
      margin-top: 18px;
      z-index: 20;
    }
    #reply-buttons button {
      width: 100%;
      padding: 16px 18px;
      border: 0;
      border-radius: 16px;
      background: var(--text);
      color: #161412;
      font-size: 16px;
      font-weight: 600;
    }

    #dead-zone {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 0;
      height: 34%;
      border: 1px dashed rgba(255,255,255,0.08);
      border-bottom: 0;
      border-radius: 18px 18px 0 0;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 10px;
      color: rgba(255,255,255,0.22);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: repeating-linear-gradient(135deg, transparent 0 10px, rgba(255,255,255,0.015) 10px 20px);
    }

    footer {
      padding: 10px 14px calc(14px + var(--safe-b));
      background: linear-gradient(180deg, transparent, rgba(11,11,12,0.92) 18%, var(--bg));
      z-index: 30;
    }
    .primary-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-bottom: 8px;
    }
    .btn {
      border: 1px solid var(--line);
      background: var(--bg-elev);
      color: var(--text);
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 13px;
      font-weight: 560;
    }
    .btn.primary {
      background: var(--text);
      color: #151311;
      border-color: transparent;
    }
    .btn.ghost { color: var(--muted); }
    .btn.danger { color: #f0c7c7; }
    .tray {
      display: grid;
      grid-template-columns: 1.2fr auto auto auto auto;
      gap: 6px;
    }
    .tray input {
      width: 100%;
      min-width: 0;
      background: var(--bg-soft);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 10px;
      font-size: 12px;
    }
    .tray .btn { padding: 11px 10px; font-size: 12px; }
    @media (max-width: 420px) {
      .tray { grid-template-columns: 1fr 1fr 1fr; }
      .tray input { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <small>Private session</small>
        <strong>Trainer</strong>
      </div>
      <div class="chips">
        <div class="chip" id="phase">Idle</div>
        <div class="chip" id="score">0</div>
        <div class="chip" id="toy-status">Toy off</div>
        <div class="chip" id="voice-label">Domi</div>
      </div>
    </header>

    <section id="stage">
      <div id="log"></div>
      <div id="info">Connect your toy, then begin.</div>
      <div id="hold-timer">0.0s</div>
      <div class="target-wrap">
        <div id="nose-btn">Hold<span>nose</span></div>
      </div>
      <div id="reply-buttons">
        <button id="btn-yes" onclick="reply('yes')">Yes, Mistress</button>
        <button id="btn-in" onclick="reply('in')">It is in</button>
        <button id="btn-thanks" onclick="reply('thanks')">Thank you, Mistress</button>
      </div>
      <div id="dead-zone">Base zone</div>
    </section>

    <footer>
      <div class="primary-row">
        <button class="btn primary" onclick="startSession()">Begin session</button>
        <button class="btn danger" onclick="stopAll()">Stop</button>
      </div>
      <div class="tray">
        <input id="intiface-ip" type="text" value="192.168.8.168" placeholder="Intiface IP">
        <button class="btn" onclick="connectToy()">Connect</button>
        <button class="btn" onclick="testVibe()">Test</button>
        <button class="btn ghost" onclick="cycleVoice()">Voice</button>
        <button class="btn ghost" onclick="enableMic()">Mic</button>
        <button class="btn ghost" onclick="changeSlaps()">Slaps <span id="slap-num">5</span></button>
      </div>
    </footer>
  </div>

  <script type="module">
    import {
      ButtplugClient,
      ButtplugBrowserWebsocketClientConnector,
      DeviceOutput,
      OutputType
    } from "https://cdn.jsdelivr.net/npm/buttplug@5/dist/web/buttplug.mjs";

    const VOICES = ["domi", "charlotte", "rachel"];
    let currentVoice = 0;
    let slapTarget = 5;
    let client = null;
    let device = null;
    let audio = null;
    let phase = "idle";
    let score = 0;
    let isHolding = false;
    let holdStart = 0;
    let slapCount = 0;
    let waitingFor = null;
    let holdTimerInterval = null;
    let micStream = null;
    let analyser = null;
    let lastSlapTime = 0;
    let prevEnergy = 0;
    let recognition = null;
    let isListening = false;

    function log(msg) {
      const el = document.getElementById("log");
      el.innerHTML = msg + "<br>" + el.innerHTML;
    }
    function setPhase(p) {
      phase = p;
      const el = document.getElementById("phase");
      el.textContent = p;
      el.classList.toggle("on", p === "training" || p === "ending");
      el.classList.toggle("warn", p === "punishment");
    }
    function setScore(s) {
      score = Math.max(0, s);
      document.getElementById("score").textContent = score;
    }
    function setInfo(text) {
      document.getElementById("info").textContent = text || "";
    }
    function setToyStatus(t) {
      const el = document.getElementById("toy-status");
      el.textContent = t;
      el.classList.toggle("on", t !== "Toy off" && t !== "—");
    }
    function showReplyButtons(which) {
      waitingFor = which;
      document.getElementById("reply-buttons").style.display = "block";
      document.getElementById("btn-yes").style.display = which === "yes" ? "block" : "none";
      document.getElementById("btn-in").style.display = which === "in" ? "block" : "none";
      document.getElementById("btn-thanks").style.display = which === "thanks" ? "block" : "none";
      startListening();
    }
    function hideReplyButtons() {
      waitingFor = null;
      document.getElementById("reply-buttons").style.display = "none";
      stopListening();
    }

    function initSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return false;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = "en-US";
      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.toLowerCase();
        log("Heard: " + transcript);
        if (!waitingFor) return;
        if (waitingFor === "yes" && (transcript.includes("yes") || transcript.includes("mistress"))) reply("yes");
        else if (waitingFor === "in" && (transcript.includes("in") || transcript.includes("it is"))) reply("in");
        else if (waitingFor === "thanks" && transcript.includes("thank")) reply("thanks");
      };
      recognition.onerror = () => { isListening = false; if (waitingFor) setTimeout(startListening, 600); };
      recognition.onend = () => { isListening = false; if (waitingFor) setTimeout(startListening, 400); };
      return true;
    }
    async function enableMic() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(t => t.stop());
        if (!recognition) initSpeech();
        setInfo("Microphone ready.");
      } catch (e) {
        setInfo("Allow microphone access in the browser.");
      }
    }
    function startListening() {
      if (!recognition || isListening || !waitingFor) return;
      try { recognition.start(); isListening = true; } catch(e) { setTimeout(startListening, 800); }
    }
    function stopListening() {
      if (recognition && isListening) { try { recognition.stop(); } catch(e){} isListening = false; }
    }

    const LINES = {
      look: "001_look_at_me_listen_carefully.mp3",
      lube: "002_lube_that_toy_up_nice_and_slow_then_slide_it_into_your_ass_f.mp3",
      goodboy: "003_good_boy.mp3",
      putin: "004_now_put_it_in_dont_make_me_wait.mp3",
      thankyou: "005_mmm_good_thank_you_for_taking_my_toy_like_a_good_boy.mp3",
      welcome: "006_youre_welcome.mp3",
      expectations: "007_youre_going_to_deepthroat_that_cock_for_me_every_time_your_n.mp3",
      begin: "008_good_begin_when_youre_ready.mp3",
      reward1: "023_there_it_is_feel_that_thats_yours.mp3",
      reward2: "024_good_boy_you_earned_that_vibration.mp3",
      stroke: "029_good_boy_you_earned_it_stroke_that_cock_for_me.mp3",
      stroke10: "030_you_can_stroke_it_now_ten_seconds.mp3",
      handsoff: "037_hands_off_now.mp3",
      fail1: "040_i_didnt_say_you_could_pull_off.mp3",
      noreward: "042_no_reward_for_that.mp3",
      slap: "044_slap_your_ass_five_times_hard_i_want_to_hear_it.mp3",
      enough: "048_good_thats_enough.mp3",
      backon: "049_now_get_back_on_that_cock_and_do_it_properly.mp3",
      closer: "058_youre_getting_closer.mp3",
      almost: "059_almost_there_keep_going.mp3",
      earned: "067_alright_youve_earned_it.mp3",
      staydown_end: "068_stay_down_on_that_cock_dont_you_dare_pull_off.mp3",
      stroke_end: "069_stroke_that_cock_for_me_harder.mp3",
      choke_end: "070_choke_on_it_while_you_jerk_off_i_want_to_hear_you_struggle.mp3"
    };

    function play(key) {
      return new Promise((resolve) => {
        const file = LINES[key];
        if (!file) { resolve(); return; }
        if (audio) { audio.pause(); audio = null; }
        const path = `audio/${VOICES[currentVoice]}/${file}`;
        log("▶ " + key);
        audio = new Audio(path);
        audio.onended = () => resolve();
        audio.onerror = () => { log("FAILED " + path); resolve(); };
        audio.play().catch(() => resolve());
      });
    }

    async function connectToy() {
      const ip = document.getElementById("intiface-ip").value.trim() || "192.168.8.235";
      const address = `ws://${ip}:12345`;
      try {
        client = new ButtplugClient("Deepthroat Trainer");
        client.addListener("deviceadded", d => {
          device = d;
          setToyStatus(d.name || d.displayName || "Connected");
        });
        client.addListener("deviceremoved", () => {
          device = null;
          setToyStatus("Toy off");
        });
        log("Connecting " + address);
        const connector = new ButtplugBrowserWebsocketClientConnector(address);
        await client.connect(connector);
        await client.startScanning();
        setInfo("Scanning for your toy.");
      } catch (e) {
        log("Connect failed: " + e.message);
        setInfo("Could not reach Intiface.");
      }
    }

    async function vibe(intensity) {
      if (!device) {
        log("No device");
        return;
      }
      intensity = Math.max(0, Math.min(1, intensity));
      log("Vibe → " + intensity.toFixed(2));
      try {
        if (intensity <= 0) {
          if (typeof device.stop === "function") {
            await device.stop();
            log("stop() OK");
            return;
          }
        }
        if (DeviceOutput && DeviceOutput.Vibrate && typeof device.runOutput === "function") {
          await device.runOutput(DeviceOutput.Vibrate.percent(intensity));
          log("runOutput() OK");
          return;
        }
      } catch (e) {
        log("runOutput error: " + (e.message || e));
      }
      try {
        if (typeof device.vibrate === "function") {
          await device.vibrate(intensity);
          log("vibrate() OK");
          return;
        }
      } catch (e) {
        log("vibrate() " + (e.message || e));
      }
      log("Vibration failed");
    }
    async function testVibe() {
      setInfo("Testing vibration.");
      await vibe(0.8);
      setTimeout(() => vibe(0), 2500);
    }
    async function stopAll() {
      await vibe(0);
      if (audio) { audio.pause(); audio = null; }
      hideReplyButtons();
      setInfo("Stopped.");
      clearInterval(holdTimerInterval);
      document.getElementById("hold-timer").style.display = "none";
    }

    async function startMic() {
      try {
        if (micStream) return;
        micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false }});
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const source = ctx.createMediaStreamSource(micStream);
        analyser = ctx.createAnalyser();
        analyser.fftSize = 512;
        source.connect(analyser);
        detectSlaps();
      } catch(e){}
    }
    function detectSlaps() {
      if (!analyser) { requestAnimationFrame(detectSlaps); return; }
      const data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(data);
      let highEnergy = 0;
      const startBin = Math.floor(data.length * 0.25);
      for (let i = startBin; i < data.length; i++) highEnergy += data[i];
      highEnergy /= (data.length - startBin);
      const spike = highEnergy - prevEnergy;
      prevEnergy = highEnergy * 0.7 + prevEnergy * 0.3;
      const now = Date.now();
      if (phase === "punishment" && highEnergy > 48 && spike > 18 && now - lastSlapTime > 380) {
        lastSlapTime = now;
        slapCount++;
        setInfo(`Slaps ${slapCount} / ${slapTarget}`);
        vibe(0.25).then(() => setTimeout(() => vibe(0), 120));
        if (slapCount >= slapTarget) {
          play("enough").then(() => {
            play("backon");
            setPhase("training");
            setInfo("Back on it.");
            slapCount = 0;
          });
        }
      }
      requestAnimationFrame(detectSlaps);
    }

    const nose = document.getElementById("nose-btn");
    const timerEl = document.getElementById("hold-timer");
    nose.addEventListener("touchstart", async e => {
      e.preventDefault();
      if (phase !== "training" && phase !== "ending") return;
      isHolding = true;
      holdStart = Date.now();
      nose.classList.add("active");
      timerEl.style.display = "block";
      timerEl.textContent = "0.0s";
      holdTimerInterval = setInterval(() => {
        timerEl.textContent = ((Date.now() - holdStart)/1000).toFixed(1) + "s";
      }, 100);
      await vibe(phase === "ending" ? 1.0 : 0.55);
    });
    nose.addEventListener("touchend", async e => {
      e.preventDefault();
      if (!isHolding) return;
      isHolding = false;
      nose.classList.remove("active");
      clearInterval(holdTimerInterval);
      timerEl.style.display = "none";
      const dur = (Date.now() - holdStart) / 1000;
      if (phase === "ending") { await vibe(0.7); return; }
      if (dur < 1.8) {
        await vibe(0);
        setScore(score - 3);
        await play("fail1");
        await play("noreward");
        await play("slap");
        setPhase("punishment");
        slapCount = 0;
        setInfo(`Slap your ass ${slapTarget} times`);
        startMic();
      } else if (dur >= 9) {
        await vibe(0.95);
        setScore(score + 12);
        await play("stroke");
        await play("stroke10");
        setInfo("Stroke for 10 seconds");
        setTimeout(async () => {
          await play("handsoff");
          setInfo("");
          await vibe(0.35);
        }, 10000);
        checkProgress();
      } else {
        await vibe(0.75);
        setScore(score + Math.floor(dur * 1.5));
        await play(Math.random() > 0.5 ? "reward1" : "reward2");
        setTimeout(() => vibe(0.3), 3500);
        checkProgress();
      }
    });
    nose.addEventListener("mousedown", () => nose.dispatchEvent(new Event("touchstart")));
    nose.addEventListener("mouseup", () => nose.dispatchEvent(new Event("touchend")));

    async function startSession() {
      setScore(0);
      setPhase("setup");
      hideReplyButtons();
      await play("look");
      await play("lube");
      setInfo("Answer her.");
      showReplyButtons("yes");
    }
    async function reply(type) {
      if (waitingFor !== type) return;
      hideReplyButtons();
      setInfo("");
      if (type === "yes") {
        await play("goodboy");
        await play("putin");
        setInfo("Answer her.");
        showReplyButtons("in");
      } else if (type === "in") {
        await play("thankyou");
        setInfo("Answer her.");
        showReplyButtons("thanks");
      } else if (type === "thanks") {
        await play("welcome");
        await play("expectations");
        await play("begin");
        setPhase("training");
        setInfo("Hold the target with your nose.");
      }
    }
    function checkProgress() {
      if (score >= 45 && phase === "training") play("closer");
      if (score >= 70 && phase === "training") play("almost");
      if (score >= 95 && phase === "training") {
        setPhase("ending");
        play("earned").then(() => {
          play("staydown_end").then(() => {
            play("stroke_end").then(() => {
              play("choke_end");
              setInfo("Stay down and finish.");
              vibe(0.9);
            });
          });
        });
      }
    }
    function cycleVoice() {
      currentVoice = (currentVoice + 1) % VOICES.length;
      document.getElementById("voice-label").textContent = VOICES[currentVoice];
    }
    function changeSlaps() {
      slapTarget = slapTarget === 5 ? 3 : slapTarget === 3 ? 8 : 5;
      document.getElementById("slap-num").textContent = slapTarget;
    }

    document.body.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
    window.startSession = startSession;
    window.reply = reply;
    window.cycleVoice = cycleVoice;
    window.connectToy = connectToy;
    window.testVibe = testVibe;
    window.enableMic = enableMic;
    window.stopAll = stopAll;
    window.changeSlaps = changeSlaps;
  </script>
</body>
